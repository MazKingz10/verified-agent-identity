name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # 🔥 Skip ClawHub karena error sebelumnya
      - name: Step 1 - Skip ClawHub
        run: echo "Skipping ClawHub (skill not available)"

      - name: Install dependencies
        run: |
          if [ -d "scripts" ]; then
            cd scripts
            npm install || true
          else
            echo "scripts folder tidak ditemukan"
          fi

      - name: Step 2 - Create new Ethereum Identity
        run: |
          if [ -f "scripts/createNewEthereumIdentity.js" ]; then
            node scripts/createNewEthereumIdentity.js
          else
            echo "createNewEthereumIdentity.js tidak ditemukan"
          fi

      - name: Step 3 - Link Human to Agent
        run: |
          if [ -f "scripts/manualLinkHumanToAgent.js" ]; then
            node scripts/manualLinkHumanToAgent.js --challenge '{"name": "MazKingz10", "description": "MazKingz10 AI Agent"}'
          else
            echo "manualLinkHumanToAgent.js tidak ditemukan"
          fi
